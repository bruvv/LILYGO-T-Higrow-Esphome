---
name: Build and publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and upload firmware for
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-firmware:
    name: Build Firmware
    uses: esphome/workflows/.github/workflows/build.yml@2026.11.0
    with:
      #### Modify below here to match your project ####
      files: LILYGO-T-Higrow-ESP32.yaml
      esphome-version: 2026.10.1
      combined-name: lilgo-t-higrow-esp32
      #### Modify above here to match your project ####

      release-summary: ${{ github.event.release.body || 'Firmware release' }}
      release-url: ${{ github.event.release.html_url || format('https://github.com/{0}/releases/tag/{1}', github.repository, inputs.release_tag) }}
      release-version: ${{ inputs.release_tag || github.event.release.tag_name }}

  upload-to-release:
    name: Upload to Release
    uses: esphome/workflows/.github/workflows/upload-to-gh-release.yml@2026.10.3
    needs:
      - build-firmware
    with:
      version: ${{ inputs.release_tag || github.event.release.tag_name }}

  deploy-installer-after-dispatch:
    name: Request web installer deployment
    if: github.event_name == 'workflow_dispatch'
    needs: [upload-to-release]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run publish-pages.yml --ref main
