---
substitutions:
  # Dashes are not supported in devicename
  devicename: "lilygohigrowplantsensor"
  friendly_name: "Plant Sensor"
  device_description: "Keep my plants safe and lively"
  project_version: "1.7.0"
  update_interval: 30min # Set this to e.g. 1min when calibrating
  loglevel: INFO
  moisture_min: "2.82"
  moisture_max: "1.39"
  conductivity_min: "0.075"
  conductivity_max: "0.25"
  # Battery sleep profile (enable battery + deepsleep packages below).
  # This is a fail-safe awake limit; the sleep script normally sleeps sooner.
  run_duration: 90s
  sleep_duration: 60min
  # Set to true when calibrating the sensors
  calibration_mode: false
  # The BH1750 already measures lux: use 1.0 unless verified against a meter.
  bh1750_correction_factor: "1.0"
  # These safety limits apply only when the optional pump package is enabled.
  waterpump_start_below: "20.0"
  waterpump_stop_above: "40.0"
  waterpump_max_run_time: 5s
  waterpump_cooldown: 6h

esphome:
  name: "${devicename}"
  friendly_name: "${friendly_name}"
  comment: "${device_description}"
  min_version: 2026.10.0
  # Automatically add the mac address to the name
  # so you can use a single firmware for all devices
  name_add_mac_suffix: true

  # This will allow for (future) project identification,
  # configuration and updates.
  project:
    name: bruvv.lilygo_t_higrow
    version: "${project_version}"
  on_boot:
    priority: 240
    then:
      - wait_until:
          condition:
            wifi.connected:
          timeout: 10s
  on_shutdown:
    then:
      - switch.turn_off: spower

dashboard_import:
  package_import_url: github://bruvv/LILYGO-T-Higrow-Esphome/LILYGO-T-Higrow-ESP32.yaml@main

esp32:
  board: lolin_d32
  framework:
    type: esp-idf

improv_serial:

wifi:
  # Use improv (after installing either go to web.esphome.io or use the installer here: https://bruvv.github.io/LILYGO-T-Higrow-Esphome)
  # ssid: !secret wifi_ssid
  # password: !secret wifi_password
  # fast_connect: True

  # No unsecured fallback AP in the public firmware. Adopt with USB Improv.
  # After adoption, optionally configure an individual password-protected AP.

# Web server disabled because it was using too much RAM
# web_server:
# port: 80

# Enable logging
logger:
  level: "${loglevel}"

api:

ota:
  - platform: esphome

time:
  - platform: homeassistant

button:
  - platform: restart
    name: "Restart - ${friendly_name}"

i2c:
  sda: 25
  scl: 26
  scan: true
  id: bus_a
  setup_priority: -200

switch:
  # Power Switch
  - platform: gpio
    name: "${friendly_name} Sensor Power switch"
    pin: 4
    id: spower
    restore_mode: ALWAYS_ON
    internal: true
    setup_priority: 1000

sensor:
  # Wifi sensor
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    id: "${devicename}_wifi_signal"
    update_interval: ${update_interval}

packages:
  bluetooth: !include common/bluetooth.yaml
  dht: !include common/dht.yaml
  plantsensors: !include common/plantsensors.yaml
  text_sensors: !include common/text_sensors.yaml
  # Watering is opt-in, with a safe disabled-on-boot switch:
  # waterpump: !include common/waterpump.yaml
  # For battery use: enable both packages, set update_interval to 10s,
  # and remove Bluetooth (details in README). Battery runtime varies by setup.
  # bme280: !include common/bme280.yaml
  # deepsleep: !include common/deepsleep.yaml
  # battery: !include common/battery.yaml
