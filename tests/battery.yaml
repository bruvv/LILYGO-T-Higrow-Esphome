---
# CI variant: battery/periodic measurement/sleep; BLE is removed.
substitutions:
  update_interval: 10s
  run_duration: 90s
  sleep_duration: 60min
packages:
  base: !include ../LILYGO-T-Higrow-ESP32.yaml
  battery: !include ../common/battery.yaml
  deepsleep: !include ../common/deepsleep.yaml

esp32_ble_tracker: !remove
bluetooth_proxy: !remove
api:
  on_client_connected: !remove
  on_client_disconnected: !remove
