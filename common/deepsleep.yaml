---
# Optional battery profile. Refresh ADC measurements every wake, then allow
# time for the native API to send them before going back to sleep.
# run_duration is a hard deadline if Wi-Fi/Home Assistant is unavailable.
deep_sleep:
  id: deep_sleep_control
  run_duration: ${run_duration}
  sleep_duration: ${sleep_duration}

esphome:
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - component.update: ${devicename}_moisture
      - component.update: ${devicename}_soil_conductivity
      - wait_until:
          condition:
            and:
              - api.connected:
              - lambda: |-
                  return id(${devicename}_moisture).has_state()
                    && id(${devicename}_soil_conductivity).has_state();
          timeout: 60s
      - delay: 3s
      - deep_sleep.enter: deep_sleep_control
